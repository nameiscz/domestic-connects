# ============================================================================
# Domestic Connects — Docker Compose with Nginx
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d
#
# Or merge into main docker-compose.yml and run:
#   docker compose up -d
# ============================================================================

services:
  # ── Nginx Reverse Proxy ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: domestic-connects-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx config
      - ./docker/nginx/nginx-selfsigned.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL certificates (self-signed or Let's Encrypt)
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      # Certbot webroot for ACME challenge
      - ./docker/nginx/certbot:/var/www/certbot:ro
      # Logs
      - ./docker/nginx/logs:/var/log/nginx
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - domestic-connects

# ── Add nginx to existing network ────────────────────────────────────
networks:
  domestic-connects:
    name: domestic-connects_default
    external: true
