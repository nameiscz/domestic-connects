# Domestic Connects — full local stack
#
#   docker compose up --build
#
# Brings up:
#   - MySQL 8.4 (one instance; schemas created on first run from
#     docker/mysql/init — see 01-create-databases.sql)
#   - Redis 7 (Spring Cache backing store for job/admin services)
#   - ZooKeeper + Kafka (Confluent 7.7, ZooKeeper-based metadata)
#     + a one-shot topic initializer
#   - eureka-server, config-server, api-gateway and all 7 microservices
#
# Every Java service builds from its own Dockerfile (<service>/Dockerfile).
# Build context is the REPO ROOT (context: .) because the services are Maven
# reactor modules — the build must see the parent POM and sibling modules
# (`mvn -pl <service> -am package`).
#
# Services run with the `docker` profile (config-server at
# http://config-server:8888, set in each service's application.yml) and
# override the datasource / Eureka / Kafka settings that default to
# `localhost` in config-repo, since inside containers that hostname is wrong.
#
#   docker compose down -v   # also removes MySQL / ZooKeeper / Kafka data
#
# NOTE: MySQL init scripts only run against an EMPTY data volume. If you have
# an existing `mysql-data` volume, run `docker compose down -v` once so the
# new schemas get created.

name: domestic-connects

services:
  # --------------------------------------------------------------------------
  # Infrastructure
  # --------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: domestic-connects-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root@123        # matches config-repo default credentials
      MYSQL_ROOT_HOST: "%"
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # Host port is 3307 because a local MySQL usually occupies 3306 on dev
    # machines. In-network access (mysql:3306) is unaffected — this mapping is
    # only for host tools (Workbench, CLI). Restore 3306:3306 when 3306 is free.
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # mysqladmin ping returns 0 during startup before connections are
      # accepted, so run a real query instead of a daemon-alive check.
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: domestic-connects-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: domestic-connects-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVER_ID: 1
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper
    healthcheck:
      # ZK 3.5+ disables most four-letter words by default — only `srvr` is
      # enabled out of the box. Its response is multi-line, so match the first
      # line ("Zookeeper version: ...") which is sufficient proof it serves.
      # Pure bash /dev/tcp — no extra binaries needed.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2181; printf \"srvr\" >&3; read -t 2 reply <&3; case \"$$reply\" in *Zookeeper*version*) exit 0;; *) exit 1;; esac'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: domestic-connects-kafka
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      # ZooKeeper-backed metadata store (no KRaft) — single broker + single ZK.
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT (in-network) + PLAINTEXT_HOST (host tools on localhost:29092)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # No CONTROLLER listener: this broker uses ZooKeeper for metadata, not KRaft.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are pre-created by kafka-init; keep auto-creation off for determinism.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Keep the broker light for local dev.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      # Only PLAINTEXT_HOST is mapped. 9092 stays internal (advertised as
      # kafka:9092) — host clients must use localhost:29092.
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # One-shot: creates the notification topics the services publish/consume.
  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    restart: on-failure   # --if-not-exists makes retries idempotent
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for topic in job-assigned salary-slip-generated performance-reviewed; do
          echo "Creating topic: $${topic}"
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$${topic}" --partitions 1 --replication-factor 1
        done

  # --------------------------------------------------------------------------
  # Platform services
  # --------------------------------------------------------------------------
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: domestic-connects-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8761'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: domestic-connects-config
    restart: unless-stopped
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # Config-repo lives on the host; keep it editable without rebuilding.
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/app/config-repo
    volumes:
      - ./config-server/config-repo:/app/config-repo:ro
    ports:
      - "8888:8888"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8888'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: domestic-connects-gateway
    restart: unless-stopped
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------------------------
  # Microservices
  # --------------------------------------------------------------------------
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: domestic-connects-auth
    restart: unless-stopped
    environment:
      # Env var (not the docker profile) — spring.config.import resolves the
      # configserver: URI during the initial config-data phase, before
      # profile-specific documents are available.
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root@123
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8081:8081"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy

  job-service:
    build:
      context: .
      dockerfile: job-service/Dockerfile
    container_name: domestic-connects-jobs
    restart: unless-stopped
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/job_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root@123
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8082:8082"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Intended producer of `job-assigned` (no KafkaTemplate wired yet) —
      # wait for topics to exist so publishing works the moment it lands.
      kafka-init:
        condition: service_completed_successfully

  attendance-service:
    build:
      context: .
      dockerfile: attendance-service/Dockerfile
    container_name: domestic-connects-attendance
    restart: unless-stopped
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/attendance_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root@123
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8083:8083"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy

  payroll-service:
    build:
      context: .
      dockerfile: payroll-service/Dockerfile
    container_name: domestic-connects-payroll
    restart: unless-stopped
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/payroll_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root@123
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8084:8084"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      # Intended producer of `salary-slip-generated` (no KafkaTemplate wired yet) —
      # wait for topics to exist so publishing works the moment it lands.
      kafka-init:
        condition: service_completed_successfully

  performance-service:
    build:
      context: .
      dockerfile: performance-service/Dockerfile
    container_name: domestic-connects-performance
    restart: unless-stopped
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/performance_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root@123
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8085:8085"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      # Intended producer of `performance-reviewed` (no KafkaTemplate wired yet) —
      # wait for topics to exist so publishing works the moment it lands.
      kafka-init:
        condition: service_completed_successfully

  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    container_name: domestic-connects-admin
    restart: unless-stopped
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      # No datasource: admin-service is a stateless aggregator (OpenFeign +
      # Redis cache). `admin_db` is created by MySQL init for future use.
    ports:
      - "8086:8086"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: domestic-connects-notifications
    restart: unless-stopped
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root@123
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8087:8087"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      # Consumer of all three topics — wait for kafka-init to finish.
      kafka-init:
        condition: service_completed_successfully

volumes:
  mysql-data:
  zookeeper-data:
  kafka-data:
