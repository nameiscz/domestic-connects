server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    # No URI here: configserver: resolves via spring.cloud.config.uri
    # (localhost:8888 locally, http://config-server:8888 under the docker profile).
    import: "configserver:"
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 1000
        max-attempts: 5
        multiplier: 1.5

---
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    config:
      uri: http://config-server:8888
