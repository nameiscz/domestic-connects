server:
  port: 8082

spring:
  application:
    name: job-service
  config:
    import: configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: true
      import-check:
        enabled: false
      retry:
        initial-interval: 1000
        max-attempts: 5
        multiplier: 1.5
  # Redis-backed Spring Cache (cache names/TTLs live in RedisCacheConfig).
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

---
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    config:
      uri: http://config-server:8888
