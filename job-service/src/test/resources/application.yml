# Overrides the main application.yml during tests.
# Removes config-server import and uses H2 in-memory database.

spring:
  application:
    name: job-service
  cloud:
    config:
      enabled: false
  # No Redis in tests — keep @Cacheable methods as pass-throughs.
  cache:
    type: none
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

eureka:
  client:
    enabled: false
