name: CI

# Runs on every push to `dev` and `staging`, plus a manual trigger so the
# pipeline can be smoke-tested before it is merged.
on:
  push:
    branches:
      - dev
      - staging
  workflow_dispatch:

# Cancel superseded runs for the same branch; keep the most recent one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build every Maven reactor module and run the unit tests
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` compiles all 10 modules, runs unit tests (surefire) and
      # packages the jars — the same JDK/version used by the Dockerfiles.
      - name: Build all modules and run unit tests
        run: mvn -B -ntp verify

      - name: Upload surefire reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Build a Docker image per service (repo root is the build context — the
  #    services are Maven reactor modules). Images are pushed to Docker Hub
  #    ONLY on push to `staging`, using repo secrets DOCKERHUB_USERNAME /
  #    DOCKERHUB_TOKEN.
  # ---------------------------------------------------------------------------
  docker-images:
    name: Docker (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build-and-test
    # First run of a matrix leg is a cold Maven build inside the image;
    # Buildx GHA cache makes subsequent runs much faster.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with <modules> in the root pom.xml
        service:
          - eureka-server
          - config-server
          - api-gateway
          - auth-service
          - job-service
          - attendance-service
          - payroll-service
          - performance-service
          - admin-service
          - notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/staging'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (push on staging only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/staging' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
