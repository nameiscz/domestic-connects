# Configuration for job-service
# Served by config-server on port 8888.
#
# Local (mvn spring-boot:run) runs use the legacy `domestic_connects_*` schemas
# on localhost:3306. The Docker stack overrides the datasource to `<service>_db`
# (see docker-compose.yml and docker/mysql/init/01-create-databases.sql).

server:
  port: 8082

spring:
  application:
    name: job-service
  datasource:
    url: jdbc:mysql://localhost:3306/domestic_connects_jobs?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${JOBS_DB_USERNAME:root}
    password: ${JOBS_DB_PASSWORD:root@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  # Redis-backed Spring Cache for GET /jobs and GET /jobs/{id}.
  # Cache names and TTLs are defined in RedisCacheConfig.
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  # Kafka producer for the `job-assigned` notification topic (best-effort
  # publishing — the assignment itself never fails if the broker is down).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Consumer decodes with type headers disabled — keep the wire payload lean.
        spring.json.add.type.headers: false

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

logging:
  level:
    com.domesticconnects.job: DEBUG
