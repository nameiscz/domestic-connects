# Configuration for notification-service
# Served by config-server on port 8888.
#
# Local (mvn spring-boot:run) runs use the legacy `domestic_connects_*` schemas
# on localhost:3306. The Docker stack overrides the datasource to `<service>_db`
# (see docker-compose.yml and docker/mysql/init/01-create-databases.sql).

server:
  port: 8087

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://localhost:3306/domestic_connects_notifications?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${NOTIFICATION_DB_USERNAME:root}
    password: ${NOTIFICATION_DB_PASSWORD:root@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Trust any payload class and always decode into NotificationEvent.
        # Type headers are ignored so producer-side DTO class names (from
        # job/payroll/performance services) never leak onto our classpath.
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.domesticconnects.notification.dto.NotificationEvent
        spring.json.use.type.headers: false

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

logging:
  level:
    com.domesticconnects.notification: DEBUG
