# Configuration for attendance-service
# Served by config-server on port 8888.

server:
  port: 8083

spring:
  application:
    name: attendance-service
  datasource:
    url: jdbc:mysql://localhost:3306/domestic_connects_attendance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${ATTENDANCE_DB_USERNAME:root}
    password: ${ATTENDANCE_DB_PASSWORD:root@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

logging:
  level:
    com.domesticconnects.attendance: DEBUG
