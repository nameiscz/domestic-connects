# Configuration for auth-service
# Served by config-server on port 8888.
#
# Local (mvn spring-boot:run) runs use the legacy `domestic_connects_*` schemas
# on localhost:3306. The Docker stack overrides the datasource to `<service>_db`
# (see docker-compose.yml and docker/mysql/init/01-create-databases.sql).

server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/domestic_connects_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${AUTH_DB_USERNAME:root}
    password: ${AUTH_DB_PASSWORD:root@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:aSecretKeyForJwtTokenGenerationAndValidationMustBeAtLeast256BitsLong}
  access-token-expiration: 900000       # 15 minutes in milliseconds
  refresh-token-expiration: 604800000   # 7 days in milliseconds

auth:
  reset-token-expiration-minutes: 30
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

logging:
  level:
    com.domesticconnects.auth: DEBUG

# Actuator — expose /actuator/health and /actuator/info (docker-compose healthchecks)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

