# Overrides the main application.yml during tests.
# Removes config-server import, uses H2 in-memory database, and disables
# Eureka registration and Kafka listener auto-start (no broker in tests).

spring:
  application:
    name: notification-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  kafka:
    listener:
      auto-startup: false

eureka:
  client:
    enabled: false
