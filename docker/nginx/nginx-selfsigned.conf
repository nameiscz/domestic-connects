# ============================================================================
# Domestic Connects — Nginx with Self-Signed SSL (for testing)
#
# Use this BEFORE setting up Let's Encrypt. Generates a self-signed cert
# so you can verify nginx works before requesting a real certificate.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d nginx
# ============================================================================

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

upstream api_gateway {
    server api-gateway:8080;
    keepalive 32;
}

# HTTP server (for certbot + redirect)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server (self-signed)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # Self-signed certificate (generated by setup-ssl.sh)
    ssl_certificate     /etc/nginx/ssl/self-signed.crt;
    ssl_certificate_key /etc/nginx/ssl/self-signed.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/domestic-connects-access.log;
    error_log  /var/log/nginx/domestic-connects-error.log;

    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /health {
        proxy_pass http://api_gateway/actuator/health;
        proxy_set_header Host $host;
    }

    location / {
        return 404 '{"error": "Not Found", "message": "Use /api/ prefix"}';
        add_header Content-Type application/json;
    }
}
