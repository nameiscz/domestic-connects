# ============================================================================
# Domestic Connects — Nginx Reverse Proxy
#
# Routes all /api/** traffic to the Spring Cloud Gateway (port 8080).
# Terminates SSL via Let's Encrypt (certbot).
#
# Usage:
#   docker compose up -d nginx
#
# The api-gateway service is NOT exposed to the public internet —
# only nginx is. This keeps JWT validation and rate-limiting behind
# a proper reverse proxy with TLS.
# ============================================================================

# Rate limiting zone: 10 requests/second per IP, burst of 20
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

upstream api_gateway {
    server api-gateway:8080;
    keepalive 32;
}

# HTTP → HTTPS redirect (port 80)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server (port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ── SSL (Let's Encrypt) ──────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/domestic-connects.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domestic-connects.com/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ── Security Headers ─────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Logging ──────────────────────────────────────────────────────────
    access_log /var/log/nginx/domestic-connects-access.log;
    error_log  /var/log/nginx/domestic-connects-error.log;

    # ── API Gateway Proxy ────────────────────────────────────────────────
    location /api/ {
        # Rate limiting
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://api_gateway;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        # Keep-alive to upstream
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }

    # ── Eureka Dashboard (protected) ─────────────────────────────────────
    # Only allow from localhost / private IPs
    location /eureka/ {
        # Allow only private ranges
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://eureka-server:8761/eureka/;
        proxy_set_header Host $host;
    }

    # ── Health Check Endpoint ────────────────────────────────────────────
    location /health {
        proxy_pass http://api_gateway/actuator/health;
        proxy_set_header Host $host;
    }

    # ── Default: Return 404 for unmatched routes ─────────────────────────
    location / {
        return 404 '{"error": "Not Found", "message": "Use /api/ prefix"}';
        add_header Content-Type application/json;
    }
}
