# Overrides the main application.yml during tests.
# Removes config-server import and uses H2 in-memory database.

spring:
  application:
    name: payroll-service
  cloud:
    config:
      enabled: false
  # No Kafka broker in tests: exclude the auto-configuration so no real
  # KafkaTemplate/producer machinery is created. KafkaTestConfig supplies a
  # no-op mock template for the NotificationPublisher to inject.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

eureka:
  client:
    enabled: false
