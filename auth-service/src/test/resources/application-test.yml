# Test configuration — overrides the bootstrap config for unit/integration tests
# Uses H2 in-memory database and disables config-server / Eureka.

spring:
  application:
    name: auth-service
  config:
    import: ""           # Override main app's configserver: import
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  autoconfigure:
    exclude:
      - org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration
      - org.springframework.cloud.client.discovery.noop.NoopDiscoveryClientAutoConfiguration
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

eureka:
  client:
    enabled: false

jwt:
  secret: testSecretKeyForJwtTokenGenerationThatIsLongEnoughForHS256Algorithm
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

auth:
  reset-token-expiration-minutes: 30
  frontend-base-url: http://localhost:5173

logging:
  level:
    com.domesticconnects.auth: DEBUG
